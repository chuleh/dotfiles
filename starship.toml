format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$python\
$gcloud\
$character 
"""

[hostname]
format = "ssh 🐠"

[directory]
format = 'cwd: [$path]($style)'
style = "bright-white"

[character]
success_symbol = "🧉"
error_symbol = "🤬"

[git_branch]
format = " | [$branch]($style)"
style = "bright-green"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = " ⦿"
untracked = " ܊"
modified = " ⌧"
staged = " ▶︎"
renamed = " ⚃"
deleted = " ␡"
stashed = " 𖭦"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"

[gcloud]
format = "[$project]($style) "
style = "bright-yellow"
